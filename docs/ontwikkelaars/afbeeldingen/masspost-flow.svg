<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1170" viewBox="0 0 680 1170" role="img">
<style>
svg{--bg:#FFFFFF;--text:#18181B;--muted:#71717A;--line:#71717A;--u-fill:#EFF6FF;--u-stroke:#3B82F6;--u-text:#1E3A8A;--u-sub:#1D4ED8;--w-fill:#FAFAFA;--w-stroke:#A1A1AA;--w-text:#27272A;--w-sub:#52525B;--e-fill:#E4E4E7;--e-stroke:#71717A;--e-text:#18181B;--e-sub:#3F3F46;--box:#D4D4D8}
@media (prefers-color-scheme:dark){svg{--bg:#0A0A0A;--text:#FAFAFA;--muted:#A1A1AA;--line:#A1A1AA;--u-fill:#172554;--u-stroke:#60A5FA;--u-text:#DBEAFE;--u-sub:#BFDBFE;--w-fill:#141416;--w-stroke:#71717A;--w-text:#F4F4F5;--w-sub:#A1A1AA;--e-fill:#27272A;--e-stroke:#A1A1AA;--e-text:#FAFAFA;--e-sub:#D4D4D8;--box:#3F3F46}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.t{font-size:14px;font-weight:500} .s{font-size:12px}
.u rect{fill:var(--u-fill);stroke:var(--u-stroke)} .u .t{fill:var(--u-text)} .u .s{fill:var(--u-sub)}
.w rect{fill:var(--w-fill);stroke:var(--w-stroke);stroke-dasharray:5 4} .w .t{fill:var(--w-text)} .w .s{fill:var(--w-sub)}
.e rect{fill:var(--e-fill);stroke:var(--e-stroke)} .e .t{fill:var(--e-text)} .e .s{fill:var(--e-sub)}
.lbl .t{fill:var(--text)} .lbl .s{fill:var(--muted)}
.leg{fill:var(--muted);font-size:12px}
.c{fill:none;stroke:var(--box);stroke-dasharray:4 4}
.arr{stroke:var(--line);stroke-width:1;fill:none}
.fail{stroke:#DC2626;stroke-width:1;fill:none;stroke-dasharray:4 3}
.spin-g{animation:sp 1s steps(12) infinite;transform-origin:10px 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin-g{animation:none}}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<symbol id="spin" viewBox="0 0 20 20"><g class="spin-g" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round">
<line x1="10" y1="2" x2="10" y2="5.5" opacity="1"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.2" transform="rotate(30 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.27" transform="rotate(60 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.34" transform="rotate(90 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.42" transform="rotate(120 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.49" transform="rotate(150 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.56" transform="rotate(180 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.63" transform="rotate(210 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.7" transform="rotate(240 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.78" transform="rotate(270 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.85" transform="rotate(300 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.92" transform="rotate(330 10 10)"/></g></symbol>
<symbol id="hb0" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#71717A" stroke-width="1.5"/></symbol>
<symbol id="hb1" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#CA8A04" stroke-width="1.5"/><path d="M10 10 L10 2 A8 8 0 0 1 18 10 Z" fill="#CA8A04"/></symbol>
<symbol id="hb2" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#CA8A04" stroke-width="1.5"/><path d="M10 10 L10 2 A8 8 0 0 1 10 18 Z" fill="#CA8A04"/></symbol>
<symbol id="hb3" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#16A34A" stroke-width="1.5"/><path d="M10 10 L10 2 A8 8 0 1 1 2 10 Z" fill="#16A34A"/></symbol>
<symbol id="hb4" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#16A34A"/><path d="M6.3 10.3 L8.8 12.7 L13.8 7.6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="hbdone" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#71717A"/><path d="M6.3 10.3 L8.8 12.7 L13.8 7.6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="hbx" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#71717A" stroke-width="1.5" stroke-dasharray="2.5 2"/><line x1="5" y1="15" x2="15" y2="5" stroke="#71717A" stroke-width="1.5" stroke-linecap="round"/></symbol>
</defs>
<rect class="bg" x="0" y="0" width="680" height="1170" rx="12"/>
<title>Flow van een mailing in vijf stappen</title><desc>Opladen, koppelen, standaardfouten, adrescontrole met een lus die verplicht is onder 96 procent, indienen, en daarna afgegeven markeren en adressen wissen.</desc>
<rect x="40" y="16" width="14" height="14" rx="3" style="fill:var(--u-fill);stroke:var(--u-stroke)"/><text class="leg" x="62" y="23" dominant-baseline="central">Jij doet iets</text>
<rect x="170" y="16" width="14" height="14" rx="3" style="fill:var(--w-fill);stroke:var(--w-stroke);stroke-dasharray:3 2"/><text class="leg" x="192" y="23" dominant-baseline="central">Wachten: bij ons of bij bpost</text>
<rect x="420" y="16" width="14" height="14" rx="3" style="fill:var(--e-fill);stroke:var(--e-stroke)"/><text class="leg" x="442" y="23" dominant-baseline="central">Eindpunt</text>

<rect class="c" x="40" y="50" width="600" height="176" rx="12"/>
<g class="lbl"><use href="#hb0" x="52" y="122" width="16" height="16"/><text class="t" x="76" y="130" dominant-baseline="central">Opladen</text><text class="s" x="76" y="150" dominant-baseline="central">Stap 1 van 5</text></g>
<g class="u"><rect x="250" y="70" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="89" text-anchor="middle" dominant-baseline="central">Nieuwe mailing</text><text class="s" x="435" y="109" text-anchor="middle" dominant-baseline="central">Bestand slepen, naam is optioneel</text></g>
<line class="arr" x1="435" y1="126" x2="435" y2="148" marker-end="url(#arrow)"/>
<g class="w"><rect x="250" y="150" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="169" text-anchor="middle" dominant-baseline="central">Bestand inlezen</text><text class="s" x="435" y="189" text-anchor="middle" dominant-baseline="central">.xlsx tot 25.000 adressen, alle kolommen naar de database</text></g>
<line class="arr" x1="435" y1="206" x2="435" y2="268" marker-end="url(#arrow)"/>

<rect class="c" x="40" y="250" width="600" height="96" rx="12"/>
<g class="lbl"><use href="#hb1" x="52" y="282" width="16" height="16"/><text class="t" x="76" y="290" dominant-baseline="central">Koppelen</text><text class="s" x="76" y="310" dominant-baseline="central">Stap 2 van 5</text></g>
<g class="u"><rect x="250" y="270" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="289" text-anchor="middle" dominant-baseline="central">Kolommen koppelen</text><text class="s" x="435" y="309" text-anchor="middle" dominant-baseline="central">Rol per kolom; Contrapunt-export herkend</text></g>
<line class="arr" x1="435" y1="326" x2="435" y2="388" marker-end="url(#arrow)"/>

<rect class="c" x="40" y="370" width="600" height="176" rx="12"/>
<g class="lbl"><use href="#hb2" x="52" y="442" width="16" height="16"/><text class="t" x="76" y="450" dominant-baseline="central">Standaardfouten</text><text class="s" x="76" y="470" dominant-baseline="central">Stap 3 van 5</text></g>
<g class="w"><rect x="250" y="390" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="409" text-anchor="middle" dominant-baseline="central">Nakijken op de regels</text><text class="s" x="435" y="429" text-anchor="middle" dominant-baseline="central">Tekens, lengte en lege velden</text></g>
<line class="arr" x1="435" y1="446" x2="435" y2="468" marker-end="url(#arrow)"/>
<g class="u"><rect x="250" y="470" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="489" text-anchor="middle" dominant-baseline="central">Voorstellen bevestigen</text><text class="s" x="435" y="509" text-anchor="middle" dominant-baseline="central">Enter per rij of alles ineens; zonder fouten vanzelf verder</text></g>
<line class="arr" x1="435" y1="526" x2="435" y2="588" marker-end="url(#arrow)"/>

<rect class="c" x="40" y="570" width="600" height="176" rx="12"/>
<g class="lbl"><use href="#hb3" x="52" y="642" width="16" height="16"/><text class="t" x="76" y="650" dominant-baseline="central">Adrescontrole</text><text class="s" x="76" y="670" dominant-baseline="central">Stap 4 van 5</text></g>
<g class="w"><rect x="250" y="590" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="609" text-anchor="middle" dominant-baseline="central">Adrescontrole bij bpost</text><text class="s" x="435" y="629" text-anchor="middle" dominant-baseline="central">Enkele minuten tot 2 uur; live melding</text></g>
<line class="arr" x1="435" y1="646" x2="435" y2="668" marker-end="url(#arrow)"/>
<g class="u"><rect x="250" y="670" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="689" text-anchor="middle" dominant-baseline="central">Score en voorstellen nakijken</text><text class="s" x="435" y="709" text-anchor="middle" dominant-baseline="central">Opnieuw controleren verplicht onder 96%</text></g>
<path class="arr" d="M250 698 L232 698 L232 618 L248 618" marker-end="url(#arrow)"/>
<line class="arr" x1="435" y1="726" x2="435" y2="788" marker-end="url(#arrow)"/>

<rect class="c" x="40" y="770" width="600" height="176" rx="12"/>
<g class="lbl"><use href="#hb4" x="52" y="842" width="16" height="16"/><text class="t" x="76" y="850" dominant-baseline="central">Indienen</text><text class="s" x="76" y="870" dominant-baseline="central">Stap 5 van 5</text></g>
<g class="u"><rect x="250" y="790" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="809" text-anchor="middle" dominant-baseline="central">Indienen</text><text class="s" x="435" y="829" text-anchor="middle" dominant-baseline="central">Parameters bevestigen; daarna ligt alles vast</text></g>
<line class="arr" x1="435" y1="846" x2="435" y2="868" marker-end="url(#arrow)"/>
<g class="w"><rect x="250" y="870" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="889" text-anchor="middle" dominant-baseline="central">Aanmaak bij bpost</text><text class="s" x="435" y="909" text-anchor="middle" dominant-baseline="central">MID-nummers terug, tot 30 minuten</text></g>
<line class="arr" x1="435" y1="926" x2="435" y2="988" marker-end="url(#arrow)"/>

<rect class="c" x="40" y="970" width="600" height="176" rx="12"/>
<g class="lbl"><use href="#hbdone" x="52" y="1042" width="16" height="16"/><text class="t" x="76" y="1050" dominant-baseline="central">Afronding</text><text class="s" x="76" y="1070" dominant-baseline="central">Na het indienen</text></g>
<g class="u"><rect x="250" y="990" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="1009" text-anchor="middle" dominant-baseline="central">Afgegeven markeren</text><text class="s" x="435" y="1029" text-anchor="middle" dominant-baseline="central">Na de deposit door Frank in het portaal</text></g>
<line class="arr" x1="435" y1="1046" x2="435" y2="1068" marker-end="url(#arrow)"/>
<g class="e"><rect x="250" y="1070" width="370" height="56" rx="8" stroke-width="1"/><text class="t" x="435" y="1089" text-anchor="middle" dominant-baseline="central">Adressen gewist</text><text class="s" x="435" y="1109" text-anchor="middle" dominant-baseline="central">30 dagen na afronding; logboek blijft</text></g>
</svg>
