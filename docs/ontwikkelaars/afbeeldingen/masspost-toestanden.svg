<svg xmlns="http://www.w3.org/2000/svg" width="680" height="880" viewBox="0 0 680 880" role="img">
<style>
svg{--bg:#FFFFFF;--text:#18181B;--muted:#71717A;--line:#71717A;--u-fill:#EFF6FF;--u-stroke:#3B82F6;--u-text:#1E3A8A;--u-sub:#1D4ED8;--w-fill:#FAFAFA;--w-stroke:#A1A1AA;--w-text:#27272A;--w-sub:#52525B;--e-fill:#E4E4E7;--e-stroke:#71717A;--e-text:#18181B;--e-sub:#3F3F46;--box:#D4D4D8}
@media (prefers-color-scheme:dark){svg{--bg:#0A0A0A;--text:#FAFAFA;--muted:#A1A1AA;--line:#A1A1AA;--u-fill:#172554;--u-stroke:#60A5FA;--u-text:#DBEAFE;--u-sub:#BFDBFE;--w-fill:#141416;--w-stroke:#71717A;--w-text:#F4F4F5;--w-sub:#A1A1AA;--e-fill:#27272A;--e-stroke:#A1A1AA;--e-text:#FAFAFA;--e-sub:#D4D4D8;--box:#3F3F46}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.t{font-size:14px;font-weight:500} .s{font-size:12px}
.u rect{fill:var(--u-fill);stroke:var(--u-stroke)} .u .t{fill:var(--u-text)} .u .s{fill:var(--u-sub)}
.w rect{fill:var(--w-fill);stroke:var(--w-stroke);stroke-dasharray:5 4} .w .t{fill:var(--w-text)} .w .s{fill:var(--w-sub)}
.e rect{fill:var(--e-fill);stroke:var(--e-stroke)} .e .t{fill:var(--e-text)} .e .s{fill:var(--e-sub)}
.lbl .t{fill:var(--text)} .lbl .s{fill:var(--muted)}
.leg{fill:var(--muted);font-size:12px}
.c{fill:none;stroke:var(--box);stroke-dasharray:4 4}
.arr{stroke:var(--line);stroke-width:1;fill:none}
.fail{stroke:#DC2626;stroke-width:1;fill:none;stroke-dasharray:4 3}
.spin-g{animation:sp 1s steps(12) infinite;transform-origin:10px 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin-g{animation:none}}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<symbol id="spin" viewBox="0 0 20 20"><g class="spin-g" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round">
<line x1="10" y1="2" x2="10" y2="5.5" opacity="1"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.2" transform="rotate(30 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.27" transform="rotate(60 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.34" transform="rotate(90 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.42" transform="rotate(120 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.49" transform="rotate(150 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.56" transform="rotate(180 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.63" transform="rotate(210 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.7" transform="rotate(240 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.78" transform="rotate(270 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.85" transform="rotate(300 10 10)"/><line x1="10" y1="2" x2="10" y2="5.5" opacity="0.92" transform="rotate(330 10 10)"/></g></symbol>
<symbol id="hb0" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#71717A" stroke-width="1.5"/></symbol>
<symbol id="hb1" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#CA8A04" stroke-width="1.5"/><path d="M10 10 L10 2 A8 8 0 0 1 18 10 Z" fill="#CA8A04"/></symbol>
<symbol id="hb2" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#CA8A04" stroke-width="1.5"/><path d="M10 10 L10 2 A8 8 0 0 1 10 18 Z" fill="#CA8A04"/></symbol>
<symbol id="hb3" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#16A34A" stroke-width="1.5"/><path d="M10 10 L10 2 A8 8 0 1 1 2 10 Z" fill="#16A34A"/></symbol>
<symbol id="hb4" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#16A34A"/><path d="M6.3 10.3 L8.8 12.7 L13.8 7.6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="hbdone" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="#71717A"/><path d="M6.3 10.3 L8.8 12.7 L13.8 7.6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="hbx" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#71717A" stroke-width="1.5" stroke-dasharray="2.5 2"/><line x1="5" y1="15" x2="15" y2="5" stroke="#71717A" stroke-width="1.5" stroke-linecap="round"/></symbol>
</defs>
<rect class="bg" x="0" y="0" width="680" height="880" rx="12"/>
<title>Toestanden van een mailing</title><desc>Tien toestanden van wordt ingelezen tot adressen gewist, met een lus van gecontroleerd terug naar controle verstuurd, een rode stippellijn als bpost de indiening weigert, en een zijtak voor intrekken.</desc>
<rect x="40" y="16" width="14" height="14" rx="3" style="fill:var(--u-fill);stroke:var(--u-stroke)"/><text class="leg" x="62" y="23" dominant-baseline="central">Actie nodig</text>
<rect x="150" y="16" width="14" height="14" rx="3" style="fill:var(--w-fill);stroke:var(--w-stroke);stroke-dasharray:3 2"/><text class="leg" x="172" y="23" dominant-baseline="central">Wachten</text>
<rect x="250" y="16" width="14" height="14" rx="3" style="fill:var(--e-fill);stroke:var(--e-stroke)"/><text class="leg" x="272" y="23" dominant-baseline="central">Klaar</text>
<line class="fail" x1="340" y1="23" x2="370" y2="23"/><text class="leg" x="378" y="23" dominant-baseline="central">bpost weigert de indiening</text>

<g class="w"><rect x="40" y="50" width="340" height="56" rx="8" stroke-width="1"/><use href="#spin" x="54" y="70" width="16" height="16"/><text class="t" x="82" y="69" dominant-baseline="central">Wordt ingelezen</text><text class="s" x="82" y="89" dominant-baseline="central">Wachten · bezig bij ons</text></g>
<line class="arr" x1="210" y1="106" x2="210" y2="128" marker-end="url(#arrow)"/>
<g class="u"><rect x="40" y="130" width="340" height="56" rx="8" stroke-width="1"/><use href="#hb0" x="54" y="150" width="16" height="16"/><text class="t" x="82" y="149" dominant-baseline="central">Opgeladen</text><text class="s" x="82" y="169" dominant-baseline="central">Actie nodig · kolommen koppelen</text></g>
<line class="arr" x1="210" y1="186" x2="210" y2="208" marker-end="url(#arrow)"/>
<g class="w"><rect x="40" y="210" width="340" height="56" rx="8" stroke-width="1"/><use href="#hb1" x="54" y="230" width="16" height="16"/><text class="t" x="82" y="229" dominant-baseline="central">Gekoppeld</text><text class="s" x="82" y="249" dominant-baseline="central">Wachten · nakijken op de regels</text></g>
<line class="arr" x1="210" y1="266" x2="210" y2="288" marker-end="url(#arrow)"/>
<g class="u"><rect x="40" y="290" width="340" height="56" rx="8" stroke-width="1"/><use href="#hb2" x="54" y="310" width="16" height="16"/><text class="t" x="82" y="309" dominant-baseline="central">Standaardfouten</text><text class="s" x="82" y="329" dominant-baseline="central">Actie nodig · zonder fouten vanzelf verder</text></g>
<line class="arr" x1="210" y1="346" x2="210" y2="368" marker-end="url(#arrow)"/>
<g class="w"><rect x="40" y="370" width="340" height="56" rx="8" stroke-width="1"/><use href="#spin" x="54" y="390" width="16" height="16"/><text class="t" x="82" y="389" dominant-baseline="central">Controle verstuurd</text><text class="s" x="82" y="409" dominant-baseline="central">Wachten op bpost</text></g>
<line class="arr" x1="210" y1="426" x2="210" y2="448" marker-end="url(#arrow)"/>
<g class="u"><rect x="40" y="450" width="340" height="56" rx="8" stroke-width="1"/><use href="#hb3" x="54" y="470" width="16" height="16"/><text class="t" x="82" y="469" dominant-baseline="central">Gecontroleerd</text><text class="s" x="82" y="489" dominant-baseline="central">Actie nodig · rood, oranje of groen</text></g>
<path class="arr" d="M40 478 L24 478 L24 398 L38 398" marker-end="url(#arrow)"/>
<line class="arr" x1="210" y1="506" x2="210" y2="528" marker-end="url(#arrow)"/>
<g class="w"><rect x="40" y="530" width="340" height="56" rx="8" stroke-width="1"/><use href="#spin" x="54" y="550" width="16" height="16"/><text class="t" x="82" y="549" dominant-baseline="central">Indiening verstuurd</text><text class="s" x="82" y="569" dominant-baseline="central">Wachten op bpost · alles ligt vast</text></g>
<path class="fail" d="M40 558 L12 558 L12 494 L38 494" marker-end="url(#arrow)"/>
<line class="arr" x1="210" y1="586" x2="210" y2="608" marker-end="url(#arrow)"/>
<g class="e"><rect x="40" y="610" width="340" height="56" rx="8" stroke-width="1"/><use href="#hb4" x="54" y="630" width="16" height="16"/><text class="t" x="82" y="629" dominant-baseline="central">Ingediend</text><text class="s" x="82" y="649" dominant-baseline="central">Klaar · na de afgiftedatum oranje met !</text></g>
<line class="arr" x1="210" y1="666" x2="210" y2="688" marker-end="url(#arrow)"/>
<g class="e"><rect x="40" y="690" width="340" height="56" rx="8" stroke-width="1"/><use href="#hbdone" x="54" y="710" width="16" height="16"/><text class="t" x="82" y="709" dominant-baseline="central">Afgerond</text><text class="s" x="82" y="729" dominant-baseline="central">Klaar · na een klik op "Afgegeven"</text></g>
<line class="arr" x1="210" y1="746" x2="210" y2="768" marker-end="url(#arrow)"/>
<g class="e"><rect x="40" y="770" width="340" height="56" rx="8" stroke-width="1"/><use href="#hbdone" x="54" y="790" width="16" height="16"/><text class="t" x="82" y="789" dominant-baseline="central">Adressen gewist</text><text class="s" x="82" y="809" dominant-baseline="central">Klaar · 30 dagen na afronding</text></g>

<line class="arr" x1="380" y1="638" x2="428" y2="638" marker-end="url(#arrow)"/>
<g class="w"><rect x="430" y="610" width="210" height="56" rx="8" stroke-width="1"/><use href="#spin" x="444" y="630" width="16" height="16"/><text class="t" x="470" y="629" dominant-baseline="central">Intrekking verstuurd</text><text class="s" x="470" y="649" dominant-baseline="central">Wachten op bpost</text></g>
<line class="arr" x1="535" y1="666" x2="535" y2="688" marker-end="url(#arrow)"/>
<g class="u"><rect x="430" y="690" width="210" height="56" rx="8" stroke-width="1"/><use href="#hbx" x="444" y="710" width="16" height="16"/><text class="t" x="470" y="709" dominant-baseline="central">Ingetrokken</text><text class="s" x="470" y="729" dominant-baseline="central">Actie nodig</text></g>
<path class="arr" d="M640 718 L656 718 L656 478 L382 478" marker-end="url(#arrow)"/>
<path class="arr" d="M535 746 L535 798 L382 798" marker-end="url(#arrow)"/>
</svg>
