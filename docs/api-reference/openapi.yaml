openapi: 3.1.0
info:
  title: HTTP API
  version: 0.4.0
  description: Generated from Zod schemas used by non-MCP route handlers. Handlers without a Zod schema are omitted.
components:
  schemas: {}
  parameters: {}
paths:
  /oauth/register:
    post:
      summary: Register an OAuth client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_name:
                  type: string
                redirect_uris:
                  type: array
                  items:
                    type: string
                    format: uri
                  minItems: 1
                grant_types:
                  type: array
                  items:
                    type: string
                  default:
                    - authorization_code
                    - refresh_token
                response_types:
                  type: array
                  items:
                    type: string
                  default:
                    - code
              required:
                - redirect_uris
      responses:
        "201":
          description: Client registered. The response body is not described by a Zod schema.
        "400":
          description: Body failed RegisterRequestSchema (invalid_client_metadata).
        "500":
          description: Registration failed (server_error).
webhooks: {}
